[project]
name = "everystep"
version = "0.1.0"
description = "Durable workflow execution for Django"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
sentry = ["sentry-sdk>=2.0"]
metrics = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.20"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.20",
    "zensical>=0.0.60",
    "mkdocstrings-python>=2.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = ["-p", "tests.pgcontainer"]
